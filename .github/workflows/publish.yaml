# Publish development commits automatically and explicit GitHub Releases.
name: Publish to npm

on:
  push:
    branches: [develop]
  release:
    types: [published]

permissions:
  contents: read
  id-token: write

concurrency:
  group: npm-sdk-${{ (github.event_name == 'push' || contains(github.event.release.tag_name, '-dev.')) && 'develop' || github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the exact publication commit
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'push' && github.sha || github.event.release.tag_name }}
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          cache: "npm"

      - name: Prepare automatic development version
        if: github.event_name == 'push'
        run: node scripts/prepare-dev-package.mjs

      - name: Validate release metadata
        id: release
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          RELEASE_PRERELEASE: ${{ github.event.release.prerelease }}
          PUBLISH_EVENT: ${{ github.event_name }}
        run: |
          node <<'NODE'
          const fs = require("node:fs");

          const packageJson = require("./package.json");
          const packageLock = require("./package-lock.json");
          const examplesPackageLock = require("./examples/package-lock.json");
          const jsrJson = require("./jsr.json");
          const configSource = fs.readFileSync("./src/lib/config.ts", "utf8");
          const version = packageJson.version;
          const sdkVersionMatch = /sdkVersion:\s*"([^"]+)"/.exec(configSource);
          if (!sdkVersionMatch) {
            throw new Error("Could not read SDK_METADATA.sdkVersion from src/lib/config.ts");
          }
          const versions = {
            "package.json": version,
            "package-lock.json": packageLock.version,
            "package-lock.json root package": packageLock.packages?.[""]?.version,
            "jsr.json": jsrJson.version,
            "examples/package-lock.json local package":
              examplesPackageLock.packages?.[".."]?.version,
            "src/lib/config.ts SDK_METADATA": sdkVersionMatch[1],
          };

          const pattern = /^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)(?:-(dev|rc)\.(0|[1-9]\d*))?$/;
          const match = pattern.exec(version);
          if (!match) {
            throw new Error(`Unsupported release version: ${version}`);
          }

          for (const [source, sourceVersion] of Object.entries(versions)) {
            if (sourceVersion !== version) {
              throw new Error(`${source} has version ${sourceVersion}; expected ${version}`);
            }
          }
          if (!configSource.includes(`speakeasy-sdk/typescript ${version} `)) {
            throw new Error(`src/lib/config.ts userAgent does not contain ${version}`);
          }

          const expectedTag = `v${version}`;
          const automatic = process.env.PUBLISH_EVENT === "push";
          if (automatic) {
            if (match[4] !== "dev" || process.env.GITHUB_REF !== "refs/heads/develop" ||
                !process.env.GITHUB_SHA || packageJson.lambdadbSourceCommit !== process.env.GITHUB_SHA) {
              throw new Error("Automatic publication requires a dev package from the exact develop push");
            }
          } else if (process.env.RELEASE_TAG !== expectedTag) {
            throw new Error(`Release tag ${process.env.RELEASE_TAG} does not match ${expectedTag}`);
          }

          const channel = match[4] ?? "stable";
          const prerelease = automatic || process.env.RELEASE_PRERELEASE === "true";
          if ((channel !== "stable") !== prerelease) {
            throw new Error(
              `${channel} version ${version} requires GitHub prerelease=${channel !== "stable"}`,
            );
          }

          const distTag = channel === "stable" ? "latest" : channel;
          const sourceBranch = channel === "dev" ? "develop" : "main";
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `version=${version}\n`);
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `dist_tag=${distTag}\n`);
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `source_branch=${sourceBranch}\n`);
          console.log(`Validated ${version}; npm dist-tag=${distTag}`);
          NODE

      - name: Verify release commit belongs to its channel branch
        env:
          SOURCE_BRANCH: ${{ steps.release.outputs.source_branch }}
        run: |
          git fetch origin "$SOURCE_BRANCH"
          if ! git merge-base --is-ancestor HEAD "origin/$SOURCE_BRANCH"; then
            echo "Release commit $(git rev-parse HEAD) is not contained in origin/$SOURCE_BRANCH" >&2
            exit 1
          fi

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build package tarball
        id: pack
        run: |
          npm pack --json > npm-pack.json
          TARBALL=$(node -p "require('./npm-pack.json')[0].filename")
          echo "tarball=$TARBALL" >> "$GITHUB_OUTPUT"
          npm pack --dry-run

      - name: Verify packed package
        env:
          EXPECTED_VERSION: ${{ steps.release.outputs.version }}
          TARBALL: ${{ steps.pack.outputs.tarball }}
        run: |
          PACKAGE_DIR=$(mktemp -d)
          npm install --prefix "$PACKAGE_DIR" "$GITHUB_WORKSPACE/$TARBALL"
          cd "$PACKAGE_DIR"
          node --input-type=module -e \
            "import('@functional-systems/lambdadb').then(() => console.log('ESM import passed'))"
          node -e \
            "require('@functional-systems/lambdadb'); console.log('CommonJS require passed')"
          INSTALLED_VERSION=$(node -p \
            "require('@functional-systems/lambdadb/package.json').version")
          test "$INSTALLED_VERSION" = "$EXPECTED_VERSION"

      - name: Verify publish toolchain
        run: |
          node --version
          npm --version

      - name: Authenticate smoke tests to AWS
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.LAMBDADB_SMOKE_AWS_ROLE_ARN }}
          aws-region: ap-northeast-2
          role-session-name: sdk-smoke-${{ github.run_id }}

      - name: Validate deployed docsUrl behavior
        env:
          LAMBDADB_BASE_URL: ${{ vars.LAMBDADB_BASE_URL }}
          LAMBDADB_PROJECT_NAME: ${{ vars.LAMBDADB_PROJECT_NAME }}
          LAMBDADB_SMOKE_SECRET_ARN: ${{ vars.LAMBDADB_SMOKE_SECRET_ARN }}
        run: node scripts/run-live-smoke.mjs

      - name: Record publication evidence
        uses: actions/upload-artifact@v7
        with:
          name: npm-${{ steps.release.outputs.version }}-${{ github.sha }}
          path: |
            ${{ steps.pack.outputs.tarball }}
            npm-pack.json
          if-no-files-found: error

      - name: Publish tested tarball
        env:
          TARBALL: ${{ steps.pack.outputs.tarball }}
          DIST_TAG: ${{ steps.release.outputs.dist_tag }}
          PUBLISH_EVENT: ${{ github.event_name }}
        run: |
          if [ "$PUBLISH_EVENT" = "push" ]; then
            git fetch origin develop
            if [ "$(git rev-parse HEAD)" != "$(git rev-parse origin/develop)" ]; then
              echo "Skipping superseded development commit $(git rev-parse HEAD)"
              exit 0
            fi
          fi
          echo "Publishing $TARBALL with npm dist-tag $DIST_TAG"
          npm publish "$TARBALL" --access public --tag "$DIST_TAG" --provenance
