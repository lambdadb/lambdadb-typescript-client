# Publish development builds from main pushes, verify release commits on main,
# and publish RC/stable GitHub Releases.
name: Publish to npm

on:
  push:
    branches: [main]
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: npm-sdk-${{ github.event_name == 'push' && 'main' || github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  mode:
    runs-on: ubuntu-latest
    outputs:
      mode: ${{ steps.mode.outputs.mode }}
      environment: ${{ steps.mode.outputs.environment }}
    steps:
      - name: Check out the exact publication commit
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'push' && github.sha || github.event.release.tag_name }}

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"

      # The committed version is always an RC or stable version. A main push whose version is
      # already tagged on origin is a development commit and publishes a dev build; a main push
      # whose version has no tag yet (a release PR merge) is verified against production only.
      # Query origin rather than local tags so a stale checkout cannot misclassify the commit.
      - name: Select the run mode
        id: mode
        env:
          PUBLISH_EVENT: ${{ github.event_name }}
        run: |
          VERSION=$(node scripts/version.mjs get)
          if [ "$PUBLISH_EVENT" != "push" ]; then
            MODE=release
          else
            case "$VERSION" in
              *-dev.*) echo "Committed version $VERSION must be an RC or stable version" >&2; exit 1 ;;
            esac
            # Exit status 2 means the tag does not exist.
            STATUS=0
            git ls-remote --exit-code --tags origin "refs/tags/v$VERSION" >/dev/null || STATUS=$?
            case "$STATUS" in
              0) MODE=dev ;;
              2) MODE=verify ;;
              *) echo "Could not query origin for tag v$VERSION" >&2; exit 1 ;;
            esac
          fi
          echo "mode=$MODE" >> "$GITHUB_OUTPUT"
          # Dev builds smoke-test against dev; release verification and Releases against prod.
          if [ "$MODE" = dev ]; then ENVIRONMENT=dev; else ENVIRONMENT=prod; fi
          echo "environment=$ENVIRONMENT" >> "$GITHUB_OUTPUT"
          echo "Committed version $VERSION; run mode $MODE"

  # The GitHub Environment holds the smoke project API key. Its deployment policy admits only
  # main (dev, prod) and v* tags (prod), so other refs cannot read the key.
  publish:
    needs: mode
    runs-on: ubuntu-latest
    environment: ${{ needs.mode.outputs.environment }}
    permissions:
      contents: read
      # npm Trusted Publishing and provenance.
      id-token: write
    steps:
      - name: Check out the exact publication commit
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'push' && github.sha || github.event.release.tag_name }}
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          cache: "npm"

      # A rerun of a stable release commit after its tag exists has no development version
      # (N = 0); the step reports ready=false with a notice and every later step is skipped.
      - name: Prepare automatic development version
        id: dev
        if: needs.mode.outputs.mode == 'dev'
        run: node scripts/prepare-dev-package.mjs

      - name: Validate release metadata
        id: release
        if: steps.dev.outputs.ready != 'false'
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          RELEASE_PRERELEASE: ${{ github.event.release.prerelease }}
          RUN_MODE: ${{ needs.mode.outputs.mode }}
        run: |
          node <<'NODE'
          const fs = require("node:fs");

          const packageJson = require("./package.json");
          const packageLock = require("./package-lock.json");
          const examplesPackageLock = require("./examples/package-lock.json");
          const jsrJson = require("./jsr.json");
          const configSource = fs.readFileSync("./src/lib/config.ts", "utf8");
          const version = packageJson.version;
          const sdkVersionMatch = /sdkVersion:\s*"([^"]+)"/.exec(configSource);
          if (!sdkVersionMatch) {
            throw new Error("Could not read SDK_METADATA.sdkVersion from src/lib/config.ts");
          }
          const versions = {
            "package.json": version,
            "package-lock.json": packageLock.version,
            "package-lock.json root package": packageLock.packages?.[""]?.version,
            "jsr.json": jsrJson.version,
            "examples/package-lock.json local package":
              examplesPackageLock.packages?.[".."]?.version,
            "src/lib/config.ts SDK_METADATA": sdkVersionMatch[1],
          };

          const pattern = /^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)(?:-(dev|rc)\.([1-9]\d*))?$/;
          const match = pattern.exec(version);
          if (!match) {
            throw new Error(`Unsupported release version: ${version}`);
          }

          for (const [source, sourceVersion] of Object.entries(versions)) {
            if (sourceVersion !== version) {
              throw new Error(`${source} has version ${sourceVersion}; expected ${version}`);
            }
          }
          if (!configSource.includes(`speakeasy-sdk/typescript ${version} `)) {
            throw new Error(`src/lib/config.ts userAgent does not contain ${version}`);
          }

          const mode = process.env.RUN_MODE;
          const channel = match[4] ?? "stable";
          const expectedTag = `v${version}`;
          if (mode === "dev") {
            if (channel !== "dev" || process.env.GITHUB_REF !== "refs/heads/main" ||
                !process.env.GITHUB_SHA || packageJson.lambdadbSourceCommit !== process.env.GITHUB_SHA) {
              throw new Error("Automatic publication requires a dev package from the exact main push");
            }
          } else if (mode === "verify") {
            if (channel === "dev" || process.env.GITHUB_REF !== "refs/heads/main") {
              throw new Error("Release verification requires an RC or stable version committed on main");
            }
          } else if (mode === "release") {
            if (channel === "dev") {
              throw new Error("Development versions publish automatically from main pushes, not GitHub Releases");
            }
            if (process.env.RELEASE_TAG !== expectedTag) {
              throw new Error(`Release tag ${process.env.RELEASE_TAG} does not match ${expectedTag}`);
            }
            if ((channel !== "stable") !== (process.env.RELEASE_PRERELEASE === "true")) {
              throw new Error(
                `${channel} version ${version} requires GitHub prerelease=${channel !== "stable"}`,
              );
            }
          } else {
            throw new Error(`Unknown run mode ${mode}`);
          }

          // Verification never publishes, so it has no dist-tag.
          const distTag = mode === "verify" ? "" : channel === "stable" ? "latest" : channel;
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `version=${version}\n`);
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `dist_tag=${distTag}\n`);
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `source_branch=main\n`);
          // Dev builds are smoke-tested against the dev environment; RC/stable releases and
          // release verification against production.
          const smokePrefix = mode === "dev" ? "LAMBDADB_DEV_" : "LAMBDADB_PROD_";
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `smoke_prefix=${smokePrefix}\n`);
          console.log(`Validated ${version} (${mode}); npm dist-tag=${distTag || "none"}`);
          NODE

      - name: Verify release commit belongs to its channel branch
        if: steps.dev.outputs.ready != 'false'
        env:
          SOURCE_BRANCH: ${{ steps.release.outputs.source_branch }}
        run: |
          git fetch origin "$SOURCE_BRANCH"
          if ! git merge-base --is-ancestor HEAD "origin/$SOURCE_BRANCH"; then
            echo "Release commit $(git rev-parse HEAD) is not contained in origin/$SOURCE_BRANCH" >&2
            exit 1
          fi

      - name: Install dependencies
        if: steps.dev.outputs.ready != 'false'
        run: npm ci

      - name: Lint
        if: steps.dev.outputs.ready != 'false'
        run: npm run lint

      - name: Typecheck
        if: steps.dev.outputs.ready != 'false'
        run: npm run typecheck

      - name: Test
        if: steps.dev.outputs.ready != 'false'
        run: npm test

      - name: Build package tarball
        id: pack
        if: steps.dev.outputs.ready != 'false'
        run: |
          npm pack --json > npm-pack.json
          TARBALL=$(node -p "require('./npm-pack.json')[0].filename")
          echo "tarball=$TARBALL" >> "$GITHUB_OUTPUT"
          npm pack --dry-run

      - name: Verify packed package
        if: steps.dev.outputs.ready != 'false'
        env:
          EXPECTED_VERSION: ${{ steps.release.outputs.version }}
          TARBALL: ${{ steps.pack.outputs.tarball }}
        run: |
          PACKAGE_DIR=$(mktemp -d)
          npm install --prefix "$PACKAGE_DIR" "$GITHUB_WORKSPACE/$TARBALL"
          cd "$PACKAGE_DIR"
          node --input-type=module -e \
            "import('@functional-systems/lambdadb').then(() => console.log('ESM import passed'))"
          node -e \
            "require('@functional-systems/lambdadb'); console.log('CommonJS require passed')"
          INSTALLED_VERSION=$(node -p \
            "require('@functional-systems/lambdadb/package.json').version")
          test "$INSTALLED_VERSION" = "$EXPECTED_VERSION"

      - name: Verify publish toolchain
        if: steps.dev.outputs.ready != 'false'
        run: |
          node --version
          npm --version

      - name: Run deployed live smoke tests
        if: steps.dev.outputs.ready != 'false'
        env:
          LAMBDADB_BASE_URL: ${{ vars[format('{0}BASE_URL', steps.release.outputs.smoke_prefix)] }}
          LAMBDADB_PROJECT_NAME: ${{ vars[format('{0}PROJECT_NAME', steps.release.outputs.smoke_prefix)] }}
          LAMBDADB_PROJECT_API_KEY: ${{ secrets.LAMBDADB_PROJECT_API_KEY }}
        run: |
          echo "Live smoke target: $LAMBDADB_BASE_URL"
          node scripts/run-live-smoke.mjs

      - name: Record publication evidence
        if: steps.dev.outputs.ready != 'false'
        uses: actions/upload-artifact@v7
        with:
          name: npm-${{ steps.release.outputs.version }}-${{ github.sha }}
          path: |
            ${{ steps.pack.outputs.tarball }}
            npm-pack.json
          if-no-files-found: error

      - name: Publish tested tarball
        if: needs.mode.outputs.mode != 'verify' && steps.dev.outputs.ready != 'false'
        env:
          TARBALL: ${{ steps.pack.outputs.tarball }}
          DIST_TAG: ${{ steps.release.outputs.dist_tag }}
          VERSION: ${{ steps.release.outputs.version }}
          PUBLISH_EVENT: ${{ github.event_name }}
        run: |
          if [ "$PUBLISH_EVENT" = "push" ]; then
            git fetch origin main
            if [ "$(git rev-parse HEAD)" != "$(git rev-parse origin/main)" ]; then
              echo "Skipping superseded development commit $(git rev-parse HEAD)"
              exit 0
            fi
            # A dev version is derived from its commit, so a rerun after publication finds it.
            PUBLISHED_COMMIT=$(npm view "@functional-systems/lambdadb@$VERSION" lambdadbSourceCommit 2>/dev/null || true)
            if [ "$PUBLISHED_COMMIT" = "$(git rev-parse HEAD)" ]; then
              echo "$VERSION is already published from this commit"
              exit 0
            elif [ -n "$PUBLISHED_COMMIT" ]; then
              echo "$VERSION is already published from $PUBLISHED_COMMIT" >&2
              exit 1
            fi
            # Never move the dev dist-tag backwards, e.g. after a release with a lower version.
            CURRENT_DEV=$(npm view "@functional-systems/lambdadb" dist-tags.dev)
            if [ -n "$CURRENT_DEV" ]; then
              ORDER=$(node scripts/version.mjs compare "$VERSION" "$CURRENT_DEV")
              if [ "$ORDER" -lt 0 ]; then
                echo "::notice::Skipping $VERSION: it is lower than the current dev dist-tag $CURRENT_DEV"
                exit 0
              fi
            fi
          fi
          echo "Publishing $TARBALL with npm dist-tag $DIST_TAG"
          npm publish "$TARBALL" --access public --tag "$DIST_TAG" --provenance
