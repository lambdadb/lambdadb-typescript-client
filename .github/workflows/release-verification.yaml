# Run deployed live smoke tests against production for every main push.
# A commit must pass this before it is tagged as an RC or stable release.
name: Release verification

on:
  push:
    branches: [main]

permissions:
  contents: read
  id-token: write

concurrency:
  group: release-verification-main
  cancel-in-progress: false

jobs:
  live-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "npm"

      - run: npm ci

      - name: Authenticate smoke tests to AWS
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.LAMBDADB_PROD_SMOKE_AWS_ROLE_ARN }}
          aws-region: ap-northeast-2
          role-session-name: sdk-release-verification-${{ github.run_id }}

      - name: Run deployed live smoke tests
        env:
          LAMBDADB_BASE_URL: ${{ vars.LAMBDADB_PROD_BASE_URL }}
          LAMBDADB_PROJECT_NAME: ${{ vars.LAMBDADB_PROD_PROJECT_NAME }}
          LAMBDADB_SMOKE_SECRET_ARN: ${{ vars.LAMBDADB_PROD_SMOKE_SECRET_ARN }}
        run: |
          echo "Live smoke target: $LAMBDADB_BASE_URL"
          node scripts/run-live-smoke.mjs
