# After an RC/stable GitHub Release publishes, open a pull request that restores the
# X.Y.Z-dev.0 placeholder on main so dev builds resume above the released version.
name: Open next development version

on:
  workflow_run:
    workflows: ["Publish to npm"]
    types: [completed]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: next-dev-version
  cancel-in-progress: false

jobs:
  open-pull-request:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'release'
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v7
        with:
          ref: main

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Open the next development version pull request
        env:
          # For a release-triggered run, head_branch is the release tag.
          RELEASE_TAG: ${{ github.event.workflow_run.head_branch }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-rc\.[1-9][0-9]*)?$ ]]; then
            echo "Unexpected release tag $RELEASE_TAG" >&2
            exit 1
          fi
          RELEASED="${RELEASE_TAG#v}"
          CURRENT=$(node scripts/version.mjs get)
          if [ "$CURRENT" != "$RELEASED" ]; then
            echo "main is at $CURRENT, not the released $RELEASED; nothing to do"
            exit 0
          fi
          NEXT=$(node scripts/version.mjs next-dev "$RELEASED")
          # One branch per release: consecutive RCs share the same next version, so the
          # release tag keeps an earlier release's merged pull request from matching.
          BRANCH="chore/next-dev-after-$RELEASE_TAG"
          # Each part is idempotent, so a rerun completes a partially finished run.
          if git ls-remote --exit-code --heads origin "$BRANCH" >/dev/null; then
            echo "$BRANCH already exists; reusing it"
          else
            node scripts/version.mjs set "$NEXT"
            git switch -c "$BRANCH"
            git -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -am "chore: start $NEXT development"
            git push origin "$BRANCH"
          fi
          STATE=$(gh pr list --head "$BRANCH" --base main --state all --json state --jq '.[0].state // ""')
          if [ -n "$STATE" ]; then
            echo "The $BRANCH pull request is $STATE; nothing to do"
            exit 0
          fi
          gh pr create --base main --head "$BRANCH" --title "chore: start $NEXT development" --body \
            "$RELEASE_TAG is published. This restores the development placeholder so dev builds resume as \`${NEXT%.0}.N\`, above the released version. Change the version with \`node scripts/version.mjs set X.Y.Z-dev.0\` if the next release is a minor or major version. Pull requests opened by GitHub Actions do not trigger CI; the publish workflow runs the full checks when this merges."
